name: TG Sender checks
on: [push, pull_request]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://test:test@127.0.0.1:5432/test
      DATABASE_SSL: disable
      LIVE_SEND_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm test
      - run: pnpm build
      - name: Build Workers and Assets without deployment or production secrets
        run: pnpm build:cloudflare
      - name: Exercise native workerd with an isolated local PostgreSQL database
        run: node scripts/cloudflare-smoke.mjs
      - name: Preserve verified deployment build
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: tg-sender-build-${{ github.sha }}
          path: |
            dist/public/
            dist/cloudflare/index.js
            dist/cloudflare/index.js.map
          retention-days: 3
          if-no-files-found: error
